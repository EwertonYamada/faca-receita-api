spring:
  application:
    name: faca-receita

  datasource:
    url: jdbc:postgresql://localhost:5432/faca_receita_db
    username: facareceita
    password: $facareceita$
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

logging:
  level:
    org:
      springframework: INFO
    com:
      faca_receita: DEBUG

jwt:
  secret: O18IsyskWGYWW7DEnJKS9IN48fZCUYtDS8ccMVFPkmQ=